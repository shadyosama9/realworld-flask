name: App Deployment

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment to use
        required: true
        type: string

      ecs_task_definition_family:
        description: ECS task definition family
        required: true
        type: string

      ecs_container_name:
        description: ECS container name
        required: true
        type: string

      ecs_cluster:
        description: ECS cluster name
        required: true
        type: string

      ecs_service:
        description: ECS service name
        required: true
        type: string

jobs:
  build-push:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    permissions:
      id-token: write
      contents: read

    outputs:
      image_tag: ${{ steps.image-tag.outputs.tag }}
      registry: ${{ steps.login-ecr.outputs.registry }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image tag
        id: image-tag
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME//\//-}"
          TIMESTAMP=$(date -u +"%Y%m%d-%H%M")
          SHORT_SHA="${GITHUB_SHA::7}"

          echo "tag=${BRANCH_NAME}-${TIMESTAMP}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ steps.image-tag.outputs.tag }}
            ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-ecs:
    runs-on: ubuntu-latest
    needs: build-push
    environment: ${{ inputs.environment }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Download task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ inputs.ecs_task_definition_family }}" \
            --query taskDefinition \
            --output json > task-definition.json

      - name: Render task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ inputs.ecs_container_name }}
          image: ${{ needs.build-push.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ needs.build-push.outputs.image_tag }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          cluster: ${{ inputs.ecs_cluster }}
          service: ${{ inputs.ecs_service }}
          wait-for-service-stability: true